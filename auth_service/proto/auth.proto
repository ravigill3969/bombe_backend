syntax = "proto3";

package auth;

option go_package = "./pb";

message RiderLoginRequest {
  string email = 1;
  string password = 2;
}

message RiderAuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool success = 3;
  int32 status_code = 4;
  string message = 5;
}

message RiderRegisterRequest {
  string firstname = 1;
  string lastname = 2;
  string email = 3;
  string password = 4;
  string phone_number = 5;
  string image_url = 6;
  string home_address = 7;
  string work_address = 8;
}

message GetRiderInfoRequest {}

message GetRiderInfoResponse {
  string firstname = 1;
  string lastname = 2;
  string email = 3;
  string phone_number = 4;
  string image_url = 5;
  double rating = 6;
  bool success = 7;
  int32 status_code = 8;
  string message = 9;
  string rider_id = 10;
}

message LogoutRiderRequest {}

message LogoutRiderResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool success = 3;
  int32 status_code = 4;
  string message = 5;
}

service RiderAuthService {
  rpc RegisterRider(RiderRegisterRequest) returns (RiderAuthResponse);
  rpc LoginRider(RiderLoginRequest) returns (RiderAuthResponse);

  rpc GetRiderInfo(GetRiderInfoRequest) returns (GetRiderInfoResponse);

  rpc LogoutRider(LogoutRiderRequest) returns (LogoutRiderResponse);
}


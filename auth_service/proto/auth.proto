message DriverInfo {
  string firstname = 1;
  string lastname = 2;
  string email = 3;
  string password = 4;
  string phone_number = 5;
  string license_no = 6;
  string image_url = 7;
}

message VehicleInfo {
  string carname = 1;
  string brand = 2;
  string model = 3;
  string make = 4;
  int32 year = 5;
  string color = 6;
  string car_plate = 7;
  string insurance_policy_no = 8;
}

message DriverRegisterRequest {
  DriverInfo driver_info = 1;
  VehicleInfo car_info = 2;
}

message DriverAuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool success = 3;
  int32 status_code = 4;
  string message = 5;
}

message DriverLoginRequest {
  string email = 1;
  string password = 2;
}

message GetDriverInfoRequest {}

message GetDriverInfoResponse {
  string firstname = 1;
  string lastname = 2;
  string email = 3;
  string phone_number = 5;
  string license_no = 6;
  string image_url = 7;
  double rating = 8;
  bool success = 9;
  int32 status_code = 10;
  string message = 11;
  string driver_id = 12;
}

message LogoutDriverRequest {}

message LogoutDriverResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool success = 3;
  int32 status_code = 4;
  string message = 5;
}

message GetDriverCarInfoRequest {}

message GetDriverCarInfoResponse {
  string vehicle_id = 1;
  string carname = 2;
  string brand = 3;
  string model = 4;
  string make = 5;
  int32 year = 6;
  string coloe = 7;
  string car_plate = 8;
  string insurance_policy_no = 9;
  bool is_verified = 10;
}

service DriverAuthService {
  rpc LoginDriver(DriverLoginRequest) returns (DriverAuthResponse);
  rpc RegisterDriver(DriverRegisterRequest) returns (DriverAuthResponse);

  rpc GetDriverInfo(GetDriverInfoRequest) returns (GetDriverInfoResponse);
  rpc GetDriverCarInfo(GetDriverCarInfoRequest) returns (GetDriverCarInfoResponse);

  rpc LogoutDriver(LogoutDriverRequest) returns (LogoutDriverResponse);
}


message CheckHealthRequest {
  string service_name = 1;
}

message CheckHealthRespone {
  bool success = 3;
  int32 status_code = 4;
  string message = 5;
}

service HealthCheckService {
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthRespone);
}

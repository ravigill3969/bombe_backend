services:
  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    env_file:
      - ./auth_service/cmd/server/.env
    ports:
      - "50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.aws:/root/.aws:ro
      
  trip-service:
    build:
      context: ./trip_service
      dockerfile: Dockerfile
    env_file:
      - ./trip_service/cmd/.env
    ports:
      - "50053:50053"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.aws:/root/.aws:ro
      

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    env_file:
      - ./payment_service/cmd/server/.env
    ports:
      - "50052:50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.aws:/root/.aws:ro

  vital-gateway:
    build:
      context: .
      dockerfile: ./vital_gateway/Dockerfile
    env_file:
      - ./vital_gateway/cmd/server/.env
    ports:
      - "8080:8080"
    volumes:
      - ~/.aws:/root/.aws:ro

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./z-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vital-gateway